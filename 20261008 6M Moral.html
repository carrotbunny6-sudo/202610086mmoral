function getMalaysiaDate() {
  const now = new Date();
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  return new Date(utc + (3600000 * 8));
}

function formatMYTDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function formatMYTTime(d) {
  const pad = n => n < 10 ? '0' + n : n;
  let h = d.getHours();
  let m = d.getMinutes();
  let s = d.getSeconds();
  const ampm = h >= 12 ? '下午' : '上午';
  h = h % 12 || 12;
  return `${ampm} ${pad(h)}:${pad(m)}:${pad(s)}`;
}

function isEdgeBrowser() {
  return navigator.userAgent.indexOf("Edg") > -1;
}

class SmartMandarinTTS {
  constructor() {
    this.enabled = true;
    this.audioPlayer = new Audio();
    this.synth = window.speechSynthesis;
    this.xiaoxiaoVoice = null;
    this.loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => this.loadVoices();
    }
  }

  loadVoices() {
    if (!this.synth) return;
    const voices = this.synth.getVoices();
    this.xiaoxiaoVoice = voices.find(v => v.name.includes("Xiaoxiao") || v.name.includes("晓晓"))
                      || voices.find(v => v.lang === "zh-CN" && v.name.includes("Natural"))
                      || voices.find(v => v.lang === "zh-CN");
  }

  speak(text) {
    if (!this.enabled) return;
    const cleanText = text.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '').trim();
    if (!cleanText) return;

    if (this.synth) this.synth.cancel();
    this.audioPlayer.pause();

    if (isEdgeBrowser() && this.xiaoxiaoVoice) {
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.voice = this.xiaoxiaoVoice;
      utter.rate = 1.05;
      utter.pitch = 1.05;
      this.synth.speak(utter);
    } else {
      const shortText = cleanText.length > 120 ? cleanText.substring(0, 115) + "。" : cleanText;
      const gUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(shortText)}`;
      this.audioPlayer.src = gUrl;
      this.audioPlayer.play().catch(e => {
        if (this.synth) {
          const fallbackUtter = new SpeechSynthesisUtterance(cleanText);
          const zhVoice = this.synth.getVoices().find(v => v.lang.includes("zh") || v.lang.includes("cmn"));
          if (zhVoice) fallbackUtter.voice = zhVoice;
          this.synth.speak(fallbackUtter);
        }
      });
    }
  }

  stop() {
    if (this.synth) this.synth.cancel();
    this.audioPlayer.pause();
  }
}
const tts = new SmartMandarinTTS();

class AudioSfx {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(freq, type, dur, delay=0, vol=0.1) {
    this.init();
    setTimeout(() => {
      try {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
      } catch(e) {}
    }, delay);
  }
  coin() { this.play(988, 'sine', 0.08, 0, 0.15); this.play(1318, 'sine', 0.25, 70, 0.15); }

}

let currentQuestionIndex = 0;

function updateHUDProgress() {
  const pct = Math.min(100, Math.round((currentQuestionIndex / RAW_QUESTIONS.length) * 100));
  document.getElementById('globalProgressFill').style.width = `${pct}%`;
  document.getElementById('progressText').textContent = `${pct}%`;
  document.getElementById('hudScore').textContent = `${scorePercent}%`;
}

/* ==============================================================
   7. 严密执行“先展示题目读题，然后才展示选项”的二阶段流程
============================================================== */
// 第一阶段：只展示题目 + 自动口播题干，选项被严格隐藏
function renderQuestionPhaseOne() {
  if (currentQuestionIndex >= RAW_QUESTIONS.length) {
    renderCompletionScreen();
    return;
  }
  updateHUDProgress();

  const item = RAW_QUESTIONS[currentQuestionIndex];
  sfx.coin();
  tts.speak(`第 ${currentQuestionIndex + 1} 题：${item.q}`);

  setScreen(`
    <div class="hud-badge" style="background:var(--c-blue);">
      ${item.unit} · 考点审读 (${currentQuestionIndex + 1}/50)
    </div>
    <div class="mega-icon">📖</div>
    <div class="single-statement" style="font-size:1.15em;">
      ${item.q}
    </div>
    <div class="statement-context" style="text-align:center;">
      🎧 语音正在为您朗读题目。请先专注看懂、思考问题核心，准备好后点击下方按键查看 4 个选项。
    </div>
    <button class="btn-action btn-gold" onclick="renderQuestionPhaseTwo()">
      已听懂题目，查看 4 个选项 ➔
    </button>
  `, null);
}

// 第二阶段：展示 4 个等长平衡选项供学生审慎选择
function renderQuestionPhaseTwo() {
  sfx.coin();
  const item = RAW_QUESTIONS[currentQuestionIndex];

  setScreen(`
    <div class="hud-badge" style="background:var(--c-blue);">
      ${item.unit} · 慎思决断 (${currentQuestionIndex + 1}/50)
    </div>
    <div class="single-statement" style="font-size:0.95em; opacity:0.85;">
      ${item.q}
    </div>
    <div class="options-grid">
      ${item.opts.map((optText, i) => `
        <button class="option-btn" onclick="chooseOption(${i})">
          <span style="color:var(--c-primary); margin-right:8px;">${String.fromCharCode(65+i)}.</span>
          <span>${optText}</span>
        </button>
      `).join('')}
    </div>
  `, null);
}

window.chooseOption = function(optIndex) {
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  const item = RAW_QUESTIONS[currentQuestionIndex];
  const isCorrect = (optIndex === item.ans);
  const chosenText = item.opts[optIndex];

  if (isCorrect) {
    allBtns[optIndex].classList.add('correct');
    sfx.coin();
    sfx.fanfare();
    // 50 题，每题占 2%
    scorePercent = Math.min(100, scorePercent + 2);
    updateHUDProgress();
    logHistory(item.val, true, chosenText, item.reason);

    setScreen(`
      <div class="mega-icon">🌟</div>
      <div class="single-statement" style="color:var(--c-green);">回答完全正确！(+2%)</div>
      <div class="statement-context">${item.reason}</div>
      <button class="btn-action" style="background:var(--c-green);" onclick="nextQuestionStep()">
        本考点掌握！进入下一题 ➔
      </button>
    `, `回答正确！${item.reason}`);
  } else {
    allBtns[optIndex].classList.add('wrong');
    sfx.buzzer();
    logHistory(item.val, false, chosenText, item.reason);

    setScreen(`
      <div class="mega-icon">🛑</div>
      <div class="single-statement" style="color:var(--c-primary);">回答有偏差，需记牢准则！</div>
      <div class="statement-context">${item.reason}</div>
      <button class="btn-action" onclick="retryQuestionStep()">
        重新理解并重试本题 ↺
      </button>
    `, `回答有偏差。${item.reason}`);
  }
};

window.nextQuestionStep = function() {
  sfx.coin();
  currentQuestionIndex++;
  renderQuestionPhaseOne();
};

window.retryQuestionStep = function() {
  sfx.coin();
  renderQuestionPhaseTwo();
};

  const c = document.createElement('canvas');
  c.width = 1600;
  c.height = 1140;
  const ctx = c.getContext('2d');

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, 1600, 1140);

  ctx.lineWidth = 14;
  ctx.strokeStyle = "#0f172a";
  ctx.strokeRect(30, 30, 1540, 1080);

  ctx.lineWidth = 4;
  ctx.strokeStyle = "#dc2626";
  ctx.strokeRect(50, 50, 1500, 1040);

  // 顶栏红饰条
  ctx.fillStyle = "#dc2626";
  ctx.fillRect(50, 50, 1500, 24);

  // 标题 (干净干练，绝无横线副标)

  // 核心学生档案框
  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(140, 340, 1320, 460);
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#cbd5e1";
  ctx.strokeRect(140, 340, 1320, 460);

  const durationSec = Math.max(1, Math.round((sessionTimes.endObj - sessionTimes.startObj) / 1000));
  const mins = Math.floor(durationSec / 60);
  const secs = durationSec % 60;
  const durationStr = `${mins > 0 ? mins + ' 分 ' : ''}${secs} 秒`;

  ctx.textAlign = "left";
  ctx.fillStyle = "#1e293b";
  ctx.font = "32px 'Yuanti SC', 'YouYuan', sans-serif";

  ctx.fillText(`👤 学生姓名：${selectedStudent.zh}（学号：${selectedStudent.no} 号 | ${selectedStudent.en}）`, 180, 415);
  ctx.fillText(`🏫 班级年级：六年级 M 班（6M 班）`, 180, 485);

function createRawPdfFromImage(dataUrl, w, h) {
  const base64 = dataUrl.split(',')[1];
  const binaryImg = atob(base64);
  const imgLen = binaryImg.length;
  const imgBytes = new Uint8Array(imgLen);
  for (let i = 0; i < imgLen; i++) imgBytes[i] = binaryImg.charCodeAt(i);

  const ptW = 842;
  const ptH = 595;

  const header = "%PDF-1.4\n";
  const obj1 = "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n";
  const obj2 = "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n";
  const obj3 = `3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`;
  const obj4Header = `4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgLen} >>\nstream\n`;
  const obj4Footer = "\nendstream\nendobj\n";

  const streamContent = `q ${ptW} 0 0 ${ptH} 0 0 cm /Im0 Do Q`;
  const obj5 = `5 0 obj\n<< /Length ${streamContent.length} >>\nstream\n${streamContent}\nendstream\nendobj\n`;

  const enc = new TextEncoder();
  const p1 = enc.encode(header + obj1 + obj2 + obj3 + obj4Header);
  const p2 = imgBytes;
  const p3 = enc.encode(obj4Footer + obj5);

  const offset1 = header.length;
  const offset2 = offset1 + obj1.length;
  const offset3 = offset2 + obj2.length;
  const offset4 = offset3 + obj3.length;
  const offset5 = offset4 + obj4Header.length + imgLen + obj4Footer.length;
  const xrefOffset = offset5 + obj5.length;

  const xref = `xref\n0 6\n0000000000 65535 f \n` +
    `${("0000000000" + offset1).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset2).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset3).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset4).slice(-10)} 00000 n \n` +
    `${("0000000000" + offset5).slice(-10)} 00000 n \n` +
    `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;

  const p4 = enc.encode(xref);
  return new Blob([p1, p2, p3, p4], { type: "application/pdf" });
}

let fontMode = 0;

  sfx.coin();

  document.body.classList.remove('font-large', 'font-huge');

  if (fontMode === 2) document.body.classList.add('font-huge');
}

}

function toggleTTS() {

/* ==============================================================
   10. 原生 Canvas 物理彩带粒子
============================================================== */
const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function triggerConfetti() {
  particles = [];
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height * 0.45,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.7) * 22,
      size: Math.random() * 8 + 6,
      color: ['#dc2626', '#f59e0b', '#0284c7', '#16a34a', '#a855f7'][Math.floor(Math.random()*5)],
      alpha: 1
    });
  }
}

function loopParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35;
    p.alpha -= 0.015;
    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  requestAnimationFrame(loopParticles);
}
loopParticles();
